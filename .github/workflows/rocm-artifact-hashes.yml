name: ROCm artifact hashes

on:
  workflow_dispatch:

jobs:
  hash-rocm-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - name: Download tarballs and compute hashes
        shell: julia {0}
        run: |
          import Pkg
          Pkg.add("ArtifactUtils")
          using ArtifactUtils, Base.BinaryPlatforms
          const rocm_version = "7.14.0"

          for rocm_arch in [
            "gfx908",
            "gfx90a",
            "gfx94X-dcgpu",
            "gfx950-dcgpu",
            "gfx101X-dgpu",
            "gfx103X-all",
            "gfx110X-all",
            "gfx1150",
            "gfx1151",
            "gfx1152",
            "gfx1153",
            "gfx120X-all",
          ]
            @info "Linux, $rocm_arch"
            platform = Platform("x86_64", "linux", Dict("libc" => "glibc", "rocm_arch" => replace(rocm_arch, "-" => "_")))
            add_artifact!("Artifacts.toml", "ROCm", "https://repo.amd.com/rocm/tarball-multi-arch/therock-dist-linux-$rocm_arch-$rocm_version.tar.gz"; lazy = true, platform)

            startswith(rocm_arch, "gfx9") && continue
            @info "Windows, $rocm_arch"
            platform = Platform("x86_64", "windows", Dict("rocm_arch" => replace(rocm_arch, "-" => "_")))
            add_artifact!("Artifacts.toml", "ROCm", "https://repo.amd.com/rocm/tarball-multi-arch/therock-dist-windows-$rocm_arch-$rocm_version.tar.gz"; lazy = true, platform)
          end
      - name: Upload hash report
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts.toml
          path: Artifacts.toml
