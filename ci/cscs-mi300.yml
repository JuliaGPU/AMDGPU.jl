include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

# Slurm/Julia settings shared by all jobs; JULIA is set per Julia version.
.common_variables: &common_variables
  # Workaround for MIOpen CK Group-Xdlops solvers segfaulting on gfx942 (MI300).
  # Remove once fixed upstream: https://github.com/ROCm/rocm-libraries/issues/9088
  MIOPEN_DEBUG_CONV_IMPLICIT_GEMM_ASM_FWD_GTC_XDLOPS_NHWC: "0"
  MIOPEN_DEBUG_GROUP_CONV_IMPLICIT_GEMM_HIP_FWD_XDLOPS: "0"
  MIOPEN_DEBUG_GROUP_CONV_IMPLICIT_GEMM_HIP_WRW_XDLOPS: "0"
  MIOPEN_DEBUG_3D_CONV_IMPLICIT_GEMM_HIP_FWD_XDLOPS: "0"
  MIOPEN_DEBUG_3D_CONV_IMPLICIT_GEMM_HIP_WRW_XDLOPS: "0"
  SLURM_JOB_NUM_NODES: 1
  SLURM_NTASKS_PER_NODE: 1
  SLURM_GPUS_PER_TASK: 2
  SLURM_TIMELIMIT: "00:45:00"
  JULIA_NUM_THREADS: 4
  JULIA_DEPOT_PATH: "${CI_PROJECT_DIR}/.julia" # overrides default ~/.julia
  JULIA_AMDGPU_CORE_MUST_LOAD: "1"
  JULIA_AMDGPU_HIP_MUST_LOAD: "1"
  # Job-scoped: comgr's cache key omits the device-library paths.
  # The default ~/.cache/comgr persists across runs and ROCm versions on a shared runner.
  AMD_COMGR_CACHE_DIR: "${CI_PROJECT_DIR}/.comgr-cache"
  # Trace layer: prints the exception behind an opaque rocfft_status_failure.
  ROCFFT_LAYER: "1"
  ROCFFT_LOG_TRACE_PATH: "${CI_PROJECT_DIR}/rocfft-trace.log"

.trace_artifacts: &trace_artifacts
  when: always
  expire_in: 1 week
  paths:
    - rocfft-trace.log

# ROCm comes from the uenv ($ROCM_LOCAL == "true", via the merged ROCM_PATH below
# and ROCm_Runtime_Discovery) or from the TheRock artifacts. ROCm_Runtime's "local"
# preference decides, and gates artifact resolution too, so it must be set before
# Pkg.instantiate(). Both variants set it explicitly and assert the result, so a
# change of default cannot silently swap the ROCm underneath a job.
#
# The uenv provides the system ROCm (and MIOpen) and is mounted only where UENV
# is set. The artifact variant runs on the bare node, without it: anything of the
# uenv's ROCm that reaches the process (LD_LIBRARY_PATH, LLVM_PATH, a tool
# library with an RPATH into it) mixes it into the artifact's, which fails at
# the first stream with hipErrorOutOfMemory (ROCm/TheRock#7426). The bundle
# needs nothing but the host's libstdc++ and the driver, and $JULIA is a
# self-contained install. The core tests assert that no foreign ROCm library is
# loaded.
.unit_test_script: &unit_test_script
  - srun -n 1 ${UENV:+--uenv $UENV --view=default} bash -c '
      set -euo pipefail;
      ulimit -c 0;
      shopt -s nullglob;
      if [ "$ROCM_LOCAL" = "true" ]; then
        MERGED_ROCM="$CI_PROJECT_DIR/.rocm-miopen";
        rm -rf "$MERGED_ROCM";
        mkdir -p "$MERGED_ROCM/lib";
        for entry in "$ROCM_PATH"/*; do
          name=$(basename "$entry");
          [ "$name" = "lib" ] && continue;
          ln -s "$entry" "$MERGED_ROCM/$name";
        done;
        ln -s "$ROCM_PATH"/lib/* "$MERGED_ROCM/lib/";
        for libdir in "$MIOPEN_PREFIX/lib" "$MIOPEN_PREFIX/lib64"; do
          ln -s "$libdir"/libMIOpen* "$MERGED_ROCM/lib/" 2>/dev/null || true;
        done;
        export ROCM_PATH="$MERGED_ROCM";
      fi;
      exec "$0" "$@"
    ' $JULIA --project -e '
      println("Instantiating project");
      using Pkg;
      Pkg.activate(pwd());
      Pkg.develop([PackageSpec(path="ROCm_Runtime"), PackageSpec(path="ROCm_Runtime_Discovery")]);
      using Preferences;
      want_local = ENV["ROCM_LOCAL"] == "true";
      set_preferences!(Base.UUID("3129f4d2-de71-4ff3-9833-76037e3ea355"), "local" => string(want_local); force=true);
      Pkg.instantiate();
      using AMDGPU;
      AMDGPU.versioninfo();
      AMDGPU.local_rocm == want_local || error("requested local_rocm=$want_local, but AMDGPU resolved to local_rocm=$(AMDGPU.local_rocm)");
      println("Running tests");
      Pkg.test("AMDGPU"; test_args=`--jobs=32`);'

UnitTest julia 1.12 (system ROCm):
  extends: .baremetal-runner-beverin-mi300
  variables:
    <<: *common_variables
    JULIA: /users/lraess/julia_amd/julia_amd-1.12
    ROCM_LOCAL: "true"
    UENV: 56ebb909a6164680
    MIOPEN_PREFIX: /user-environment/linux-zen3/miopen-hip-7.2.3-kxzfucnamke4rlezapmrmrdrkmri325u
  script: *unit_test_script
  artifacts: *trace_artifacts

